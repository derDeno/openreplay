name: Publish base container images

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build
        required: false
        default: main
      images:
        description: Comma-separated images, or all
        required: false
        default: all

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}
  TARGET_REF: ${{ (github.event_name == 'workflow_dispatch' && inputs.ref) || 'main' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - id: matrix
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.images || 'all' }}'
          if [[ "$requested" == all ]]; then
            value='["kafka", "postgres:17", "postgres:18", "migration", "valkey"]'
          else
            value=$(jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; ""))' <<< "$requested")
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ env.TARGET_REF }}

      - name: Resolve build context and tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          image='${{ matrix.image }}'
          if [[ "$image" == *:* ]]; then
            name=${image%%:*}
            version=${image##*:}
            context="scripts/dockerfiles/${name}/${version}"
            dockerfile="${context}/Dockerfile"
          elif [[ "$image" == migration ]]; then
            name=migration
            version="$(git rev-parse --short HEAD)"
            context='.'
            dockerfile='scripts/dockerfiles/migration/Dockerfile'
          else
            name="$image"
            context="scripts/dockerfiles/${name}"
            dockerfile="${context}/Dockerfile"
            case "$name" in
              kafka) version=$(grep -oP 'kafka~\K[0-9]+' "$dockerfile" || echo 3) ;;
              valkey) version=$(grep -oP 'valkey>=\K[0-9]+' "$dockerfile" | head -1 || echo 8) ;;
              *) version=latest ;;
            esac
          fi

          image_name="${REGISTRY}/${IMAGE_PREFIX}/${name}"
          tags="${image_name}:${version}"
          if [[ "$name" != migration && "$name" != postgres || "$version" == 18 ]]; then
            tags+=$'\n'"${image_name}:latest"
          fi

          {
            echo "context=$context"
            echo "dockerfile=$dockerfile"
            echo "tags<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.image.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
